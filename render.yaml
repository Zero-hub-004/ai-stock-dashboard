services:
  - type: web
    name: ai-stock-dashboard-api
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
    envVarGroups:
      - name: api-keys
        envVars:
          - key: OPENAI_API_KEY
            sync: false
          - key: GROQ_API_KEY
            sync: false
          - key: SUPABASE_URL
            sync: false
          - key: SUPABASE_ANON_KEY
            sync: false
